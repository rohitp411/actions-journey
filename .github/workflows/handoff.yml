name: handoff
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: write a file
        run: echo "My file in a fob" > app.txt
      - name: upload
        uses: actions/upload-artifact@v4
        with: 
          name: app-package
          path: app.txt

  verify:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: download
        uses: actions/download-artifact@v4
        with:
          name: app-package
      - name: verify 
        run: test -f app.txt
    
      
