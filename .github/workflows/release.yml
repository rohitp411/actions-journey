name: parallel
on: push
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: info
        run: echo "linting" 

  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: testing
        run: echo "testing successfully"

  package:
    runs-on: ubuntu-latest
    needs: [lint, unit-tests]
    steps:
      - name: message
        run: echo "packaging done successfully"

